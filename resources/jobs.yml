resources:
  jobs:
    workshop_full_run:
      name: "[${bundle.target}] PinjamKilat Workshop — Full Run"
      description: "Runs all 5 workshop notebooks end-to-end. Useful for sanity checks and refresh."
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
          environment_key: default
        - task_key: ai_extract_kyc
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: ../notebooks/01_ai_extract_kyc.py
          environment_key: default
        - task_key: ai_classify_risk
          depends_on: [{task_key: ai_extract_kyc}]
          notebook_task:
            notebook_path: ../notebooks/02_ai_classify_risk.py
          environment_key: default
        - task_key: decisioning
          depends_on: [{task_key: ai_classify_risk}]
          notebook_task:
            notebook_path: ../notebooks/03_silver_gold_decisioning.py
          environment_key: default
        - task_key: risk_genie
          depends_on: [{task_key: decisioning}]
          notebook_task:
            notebook_path: ../notebooks/04_risk_genie.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
      max_concurrent_runs: 1
